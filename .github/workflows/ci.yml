name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Don't let the app try to pip-install renishawWiRE during import.
      BIORAMAN_NO_AUTOINSTALL: "1"
      # Headless matplotlib.
      MPLBACKEND: "Agg"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tk (for tkinter import)
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy matplotlib pybaselines pillow \
                      scikit-learn pandas pytest

      - name: Byte-compile
        run: python -m py_compile bioraman.py raman_metadata.py

      - name: Unit tests
        run: pytest -q

      - name: Concentration validation (synthetic phantom)
        run: python validation/validate_concentration.py --tol 1.0
